<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Floor DS Studio (use case)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg-app:#0F172A;--bg-panel:#1E293B;--bg-raised:#243247;--tp:#F8FAFC;--ts:#94A3B8;--border:#334155;--focus:#93C5FD;--brand:#0D9488;--int:#3B82F6;--int-h:#2563EB;
--w-token:#818CF8;--w-text:#60A5FA;--w-comp:#34D399;--w-report:#CBD5E1;--w-theme:#F0ABFC;--ease:cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg-app);color:var(--tp);font:13px/1.5 Geist,system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
code,.mono{font-family:"Geist Mono",ui-monospace,monospace;font-size:11px}
code{background:var(--bg-app);padding:1px 5px;border-radius:4px;border:1px solid var(--border)}
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:0 16px;background:#0B1220;border-bottom:1px solid var(--border);min-width:0}
.logo{display:flex;align-items:center;gap:10px;font-family:Outfit;font-weight:700;font-size:15px;white-space:nowrap}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
.nav{display:flex;gap:2px}
.nav button{border:0;background:none;padding:0 12px;height:36px;border-radius:8px;cursor:pointer;color:var(--ts);font-weight:500}
.nav button[aria-current=page]{background:var(--bg-panel);color:var(--tp)}
.seg{display:flex;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:3px;margin-left:auto}
.seg button{border:0;background:none;padding:0 10px;height:30px;border-radius:6px;cursor:pointer;color:var(--ts);font-weight:500;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--int-h);color:#fff}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--bg-panel);border-radius:8px;padding:0 12px;height:36px;cursor:pointer;font-weight:500;white-space:nowrap}
.tbtn:hover{background:var(--bg-raised)}
.tbtn.primary{background:var(--int-h);border-color:var(--int-h);color:#fff}
.view{display:none;min-height:0}.view.on{display:grid}
/* canvas view */
#vCanvas{grid-template-columns:232px 1fr 380px}
.lib{background:var(--bg-panel);border-right:1px solid var(--border);overflow:auto;padding:12px}
.lib h3{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--ts);margin:14px 4px 6px;text-transform:uppercase}
.flowsel{width:100%;height:36px;background:var(--bg-app);border:1px solid var(--border);border-radius:8px;padding:0 8px}
.li{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px;cursor:pointer;text-align:left;min-height:40px}
.li:hover{background:var(--bg-raised);border-color:var(--border)}
.li i{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex:none}
.li small{display:block;color:var(--ts);font-size:11px;line-height:1.25}
.canvas{position:relative;overflow:hidden;background:var(--bg-app);background-image:radial-gradient(#253349 1px,transparent 1px);background-size:20px 20px;cursor:grab}
.canvas.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
svg.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.wires path.hit{pointer-events:stroke;cursor:pointer;stroke:transparent;stroke-width:14;fill:none}
svg.wires path.w{fill:none;stroke-width:2}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;z-index:5}
.zoom button{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--bg-panel);cursor:pointer}
.banner{position:absolute;left:12px;top:12px;right:12px;z-index:5;background:rgba(30,41,59,.95);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px}
.banner b{font-family:Outfit}
.node{position:absolute;width:270px;background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.node.wide{width:330px}.node.xwide{width:430px}
.node.sel{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.node.ai-touched{border-color:#A78BFA}
.node.pop{animation:pop .5s var(--ease)}
@keyframes pop{from{transform:scale(.93);opacity:0}to{transform:none;opacity:1}}
.nh{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px;border-bottom:1px solid var(--border);cursor:move;user-select:none}
.nh .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none}
.nh .nt{font-family:Outfit;font-weight:700;font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nh .x{border:0;background:none;color:var(--ts);cursor:pointer;width:24px;height:24px;border-radius:4px}
.nh .x:hover{background:var(--bg-raised);color:var(--tp)}
.tag{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tag.ai{background:#2E1065;color:#DDD6FE}.tag.by{background:#3B0764;color:#E9D5FF}
.ports{padding:5px 0}
.prow{position:relative;display:flex;align-items:center;justify-content:space-between;padding:2px 14px;font-size:11px;color:var(--ts);min-height:22px}
.port{position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;border:2px solid var(--bg-panel);cursor:crosshair}
.port.in{left:-7px}.port.out{right:-7px}.port:hover{transform:scale(1.3)}
.prow .val{color:var(--tp);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb{padding:10px 12px 12px;border-top:1px solid var(--border)}
.field{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;margin-bottom:7px}
.field label{font-size:11px;color:var(--ts)}
.field select,.field input{width:100%;height:30px;background:var(--bg-app);border:1px solid var(--border);border-radius:6px;padding:0 8px;font-size:12px}
.swatch{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ts)}
.swatch b{width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,.15);flex:none}
.typeprev{background:var(--bg-app);border-radius:6px;padding:8px;border:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{background:#F1F5F9;border-radius:8px;padding:14px 10px;display:flex;justify-content:center;align-items:center;min-height:80px;overflow:hidden}
.stage.white{background:#fff}
.stage.dark{background:#0F172A}
.scrbox{border-radius:8px;overflow:hidden;border:1px solid var(--border);position:relative}
.scrbox>.k{transform-origin:0 0;position:absolute;left:0;top:0}
.meter{height:6px;background:var(--bg-app);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;border-radius:4px;transition:width .4s var(--ease)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;white-space:nowrap}
.pill.pass{background:#064E3B;color:#A7F3D0}.pill.warn{background:#78350F;color:#FDE68A}.pill.fail{background:#7F1D1D;color:#FECACA}.pill.na{background:#334155;color:#CBD5E1}
.checks{list-style:none;margin:8px 0 0;padding:0}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:11px;padding:3px 0;color:var(--ts)}
.checks li b{color:var(--tp);font-weight:500}
.checks svg{flex:none;margin-top:2px}
.big{font-family:Outfit;font-weight:700;font-size:22px;line-height:1.1}
.small{font-size:12px;color:var(--ts)}
.empty{font-size:12px;color:var(--ts);padding:8px;border:1px dashed var(--border);border-radius:6px;text-align:center}
.running .nh .ic{animation:blink .8s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid #CBD5E1;border-top-color:#2563EB;animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.abtn{height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-app);cursor:pointer;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.abtn:hover{background:var(--bg-raised)}
.abtn.go{background:var(--int-h);border-color:var(--int-h);color:#fff}
/* side panel */
.side{background:var(--bg-panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 8px}
.tabs button{border:0;background:none;padding:13px 10px 11px;cursor:pointer;color:var(--ts);font-weight:500;border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--tp);border-bottom-color:var(--int)}
.pane{flex:1;overflow:auto;padding:16px;display:none}.pane.on{display:block}
.chatwrap{display:none;flex-direction:column;flex:1;min-height:0}.chatwrap.on{display:flex}
.thread{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{font-size:13px;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--bg-raised);border:1px solid var(--border);padding:8px 12px;border-radius:12px 12px 4px 12px;max-width:85%}
.msg .who{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ts);margin-bottom:4px}
.msg .who i{width:18px;height:18px;border-radius:5px;background:#5B21B6;display:grid;place-items:center}
.msg p{margin:0 0 8px}
.step{font-size:12px;color:var(--ts);display:flex;gap:6px;align-items:center}
.step::before{content:"";width:6px;height:6px;border-radius:50%;background:#A78BFA;flex:none}
.card{background:var(--bg-app);border:1px solid var(--border);border-radius:12px;padding:12px;margin:4px 0 8px}
.card h4{margin:0 0 4px;font-family:Outfit;font-size:13px}
.issue{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--border);font-size:12px}
.issue:first-of-type{border-top:0}
.issue .d{flex:1;color:var(--ts)}.issue .d b{color:var(--tp);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--border);background:var(--bg-app);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:12px;min-height:32px}
.chip:hover{background:var(--bg-raised)}
.chip.rec{border-color:var(--int);color:#BFDBFE}.chip.both{border-color:#A78BFA;color:#DDD6FE}
.composer{border-top:1px solid var(--border);padding:12px;display:flex;gap:8px}
.composer input{flex:1;height:40px;background:var(--bg-app);border:1px solid var(--border);border-radius:8px;padding:0 12px}
.composer button{width:40px;height:40px;border-radius:8px;border:0;background:var(--int-h);color:#fff;cursor:pointer}
.rule{border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden}
.rule h4{margin:0;padding:9px 12px;font-family:Outfit;font-size:13px;background:var(--bg-app);border-bottom:1px solid var(--border)}
.dd{display:grid;grid-template-columns:1fr 1fr}
.dd div{padding:10px 12px;font-size:12px;color:var(--ts)}
.dd div:first-child{border-right:1px solid var(--border)}
.dd b{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;margin-bottom:4px}
.dd .do b{color:#6EE7B7}.dd .dont b{color:#FCA5A5}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;margin:8px 0}.kv dt{color:var(--ts)}.kv dd{margin:0}
.hist{list-style:none;padding:0;margin:8px 0}.hist li{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:7px 0;border-bottom:1px solid var(--border)}
/* library view */
#vLib{grid-template-columns:240px 1fr}
.lnav{background:var(--bg-panel);border-right:1px solid var(--border);overflow:auto;padding:12px}
.lnav h3{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--ts);margin:14px 6px 4px;text-transform:uppercase}
.lnav button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--ts)}
.lnav button:hover{background:var(--bg-raised);color:var(--tp)}
.lnav button[aria-current=true]{background:var(--bg-raised);color:var(--tp);box-shadow:inset 3px 0 0 var(--brand)}
.ldoc{overflow:auto;padding:32px 40px 64px}
.ldoc h1{font-family:Outfit;font-size:26px;margin:0 0 4px}
.ldoc h2{font-family:Outfit;font-size:17px;margin:28px 0 10px}
.ldoc .lead{color:var(--ts);max-width:760px;margin:0 0 18px;font-size:14px}
.lcard{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vcell{background:#F1F5F9;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;color:#0F172A;min-height:90px}
.vcell .cap{font-size:11px;color:#475569;font-family:"Geist Mono"}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.sw div{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg-panel)}
.sw i{display:block;height:56px}
.sw p{margin:0;padding:8px 10px;font-size:11px;color:var(--ts);line-height:1.45}
.sw p b{color:var(--tp);font-family:"Geist Mono";font-weight:500}
.spec{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.spec span{font-size:11px;font-family:"Geist Mono";background:var(--bg-app);border:1px solid var(--border);border-radius:4px;padding:2px 8px;color:var(--ts)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl td,.tbl th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}.tbl th{color:var(--ts);font-weight:500}
.scrfull{border-radius:12px;overflow:hidden;border:1px solid var(--border);position:relative}
.scrfull>.k{transform-origin:0 0;position:absolute;left:0;top:0}
/* files */
#vFiles,#vNew{overflow:auto}
.fwrap{max-width:1180px;margin:0 auto;padding:32px 40px 64px;width:100%}
.fhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.fhead h1{font-family:Outfit;font-size:26px;margin:0}
.fhead p{margin:4px 0 0;color:var(--ts)}
.ftools{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.inp{height:36px;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:0 10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.fcard{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s var(--ease)}
.fcard:hover{border-color:#475569}
.fcard.cur{border-color:var(--int)}
.fthumb{height:150px;background:var(--bg-app);background-image:radial-gradient(#253349 1px,transparent 1px);background-size:14px 14px;border:0;border-bottom:1px solid var(--border);cursor:pointer;padding:0;display:block;width:100%}
.fbody{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.fname{font-family:Outfit;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.fmeta{font-size:12px;color:var(--ts)}
.fact{display:flex;gap:4px;padding:8px 10px;border-top:1px solid var(--border);align-items:center}
.ib{width:32px;height:32px;border-radius:6px;border:0;background:none;color:var(--ts);cursor:pointer;display:grid;place-items:center}
.ib:hover{background:var(--bg-raised);color:var(--tp)}
.ib.danger:hover{color:#FCA5A5}
.newcard{border:1px dashed #475569;border-radius:12px;background:none;cursor:pointer;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ts);font-weight:500}
.newcard:hover{border-color:var(--int);color:var(--tp)}
.newcard i{width:44px;height:44px;border-radius:12px;background:var(--int-h);display:grid;place-items:center;color:#fff}
.note{font-size:12px;color:var(--ts);background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:16px;display:flex;gap:8px;align-items:center}
.form{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fld label,.fld legend{font-weight:500;font-size:13px}
.fld .hint{font-size:12px;color:var(--ts)}
.fld input[type=text],.fld textarea,.fld select{background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:inherit;color:inherit}
.fld textarea{min-height:70px;resize:vertical}
.fld .err{color:#FCA5A5;font-size:12px;display:none;align-items:center;gap:6px}
.fld.bad input{border-color:#F87171}.fld.bad .err{display:flex}
fieldset.fld{border:0;padding:0;margin:0 0 16px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.topt{position:relative;display:block;cursor:pointer}
.topt input{position:absolute;opacity:0}
.topt .tc{border:1px solid var(--border);border-radius:12px;background:var(--bg-panel);padding:12px;display:flex;flex-direction:column;gap:6px;height:100%;transition:border-color .2s var(--ease)}
.topt input:checked + .tc{border-color:var(--int);box-shadow:0 0 0 1px var(--int)}
.topt input:focus-visible + .tc{outline:2px solid var(--focus);outline-offset:2px}
.topt .tt{font-weight:600;display:flex;align-items:center;gap:8px}
.topt .td{font-size:12px;color:var(--ts)}
.topt .chain{display:flex;flex-wrap:wrap;gap:4px}
.topt .chain span{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bg-app);border:1px solid var(--border);color:var(--ts)}
.sumcard{position:sticky;top:0;background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.sumcard h3{font-family:Outfit;margin:0 0 8px;font-size:15px}
/* file chip + menu */
.filechip{display:flex;align-items:center;gap:6px;min-width:0;padding-left:10px;border-left:1px solid var(--border)}
.filechip input{background:none;border:1px solid transparent;border-radius:6px;height:32px;padding:0 8px;font-weight:600;width:200px;min-width:80px;text-overflow:ellipsis}
.filechip input:hover{border-color:var(--border)}.filechip input:focus{border-color:var(--int);background:var(--bg-app)}
.fstat{font-size:11px;color:var(--ts);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.fstat .d{width:7px;height:7px;border-radius:50%;background:#F59E0B}
.mwrap{position:relative}
.menu{position:absolute;top:40px;left:0;z-index:40;min-width:240px;background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.4);padding:6px;display:none}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--bg-raised)}
.menu button kbd{margin-left:auto;font:11px "Geist Mono";color:var(--ts)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.menu .danger{color:#FCA5A5}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.scrim.on{display:flex}
.modal{background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.modal h2{font-family:Outfit;font-size:17px;margin:0;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal .mb{padding:16px 18px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
.modal textarea{width:100%;min-height:180px;background:var(--bg-app);border:1px solid var(--border);border-radius:8px;padding:10px;font:11px/1.5 "Geist Mono";color:var(--tp);resize:vertical}
.tbtn.danger{background:#B91C1C;border-color:#B91C1C;color:#fff}
.drop{border:1px dashed #475569;border-radius:10px;padding:16px;text-align:center;color:var(--ts);font-size:12px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg-raised);border:1px solid var(--border);padding:10px 14px;border-radius:8px;font-size:12px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ Factory Floor DS components (.k = rendered system) ============ */
.k{--app:#F1F5F9;--panel:#FFFFFF;--tx:#0F172A;--tx2:#475569;--muted:#94A3B8;--bd:#E2E8F0;--fc:#2563EB;--side:#1E293B;--head:#0F172A;--meta:#475569;
  font-family:Geist,system-ui,sans-serif;font-size:13px;line-height:1.45;color:var(--tx)}
.k.dark{--app:#0F172A;--panel:#1E293B;--tx:#F8FAFC;--tx2:#94A3B8;--muted:#64748B;--bd:#334155;--fc:#93C5FD;--side:#0B1220;--head:#020617}
.k *{box-sizing:border-box}
.k .h-lg{font-family:Outfit;font-size:18px;font-weight:700}
.k .h-md{font-family:Outfit;font-size:14px;font-weight:700}
.k .b-sm{font-size:11px}
.k .lbl{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.k .mono{font-family:"Geist Mono";font-size:11px;font-weight:500}
.k .meta{color:var(--meta);font-size:11px}
.k-dot{width:10px;height:10px;border-radius:9999px;display:inline-block;flex:none}
.k-dotwrap{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.k-badge{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:4px;color:#0F172A;font-size:10px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.k-badge .k-dot{width:6px;height:6px}
.k-tool{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;border:0;background:transparent;color:var(--tx2);cursor:pointer;transition:background .2s var(--ease)}
.k-tool.hover{background:var(--app)}
.k-tool.active{background:#0D9488;color:#fff}
.k-tool.small{width:32px;height:32px}
.k-pbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:0 18px;min-height:44px;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.15);white-space:nowrap;font-family:Outfit;font-size:14px;font-weight:700}
.k-pbtn.sec{background:var(--panel)!important;color:var(--tx)!important;border:1px solid var(--bd);box-shadow:none}
.stage .k-row{width:380px}.k-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;min-height:44px;border-bottom:1px solid var(--bd);background:var(--panel);width:100%}
.k-row.compact{min-height:36px}
.k-row .l{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
.k-row .r{display:flex;align-items:center;gap:12px}
.k-bar{height:6px;border-radius:4px;background:var(--bd);overflow:hidden;width:60px;flex:none}
.k-bar i{display:block;height:100%;border-radius:4px}
.k-tagio{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--app);color:var(--tx2);border:1px solid var(--bd)}
.stage .k-phead{width:380px}.k-phead{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 10px 0 16px;background:var(--panel);border-bottom:1px solid var(--bd);width:100%}
.k-alert{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid;font-size:13px;color:#0F172A;width:100%}
.k-alert b{font-weight:600}
.k-nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;color:#94A3B8;font-size:13px;width:100%;position:relative}
.k-nav.on.fill{background:#0D9488;color:#fff}
.k-nav.on.ind{background:#0F172A;color:#fff}
.k-nav.on.ind::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:#0D9488;border-radius:0}
.k-input{display:flex;flex-direction:column;gap:4px;width:100%}
.k-input .box{height:40px;border-radius:8px;border:1px solid;background:var(--panel);padding:0 12px;display:flex;align-items:center;font-size:13px;color:var(--tx)}
.k-input .help{display:flex;align-items:center;gap:6px;font-size:11px}
.k-kpi{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:130px}
.k-card{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.k-ai{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:#EEF2FF;color:#3730A3}
.k-state{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:16px;color:var(--tx2);font-size:13px}
.k-bubble{padding:8px 12px;border-radius:12px;font-size:12px;max-width:85%}
.k-bubble.u{align-self:flex-end;background:#2563EB;color:#fff;border-bottom-right-radius:4px}
.k-bubble.a{align-self:flex-start;background:var(--app);color:var(--tx);border-bottom-left-radius:4px;border:1px solid var(--bd)}
.k-chip{border:1px solid var(--bd);background:var(--panel);border-radius:999px;padding:0 12px;min-height:32px;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx)}
.k-focus{outline:2px solid var(--fc);outline-offset:2px}
@media (max-width:1180px){#vCanvas{grid-template-columns:1fr 340px}.lib{display:none}}
@media (max-width:860px){#vCanvas{grid-template-columns:1fr;grid-template-rows:60vh auto}#vLib{grid-template-columns:1fr}.lnav{display:none}.seg{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><i aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M9 6h4a2 2 0 0 1 2 2v7"/></svg></i>Factory Floor DS Studio</div>
    <nav class="nav" aria-label="Views"><button data-view="files">Files</button><button data-view="canvas" aria-current="page">Node canvas</button><button data-view="lib">Design system</button></nav>
    <div class="filechip" id="fileChip">
      <div class="mwrap"><button class="tbtn" id="fileMenuBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="fileMenu">File <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="menu" id="fileMenu" role="menu"></div></div>
      <label class="sr" for="fileName">Graph name</label><input id="fileName" maxlength="60">
      <span class="fstat" id="fstat" role="status"></span>
    </div>
    <div class="seg" role="group" aria-label="Who is using the canvas" id="seg">
      <button data-mode="user" aria-pressed="false">User 1 · AI as a node</button>
      <button data-mode="builder" aria-pressed="false">Builder · AI as builder</button>
      <button data-mode="both" aria-pressed="true">Both</button>
    </div>
    <button class="tbtn primary" id="runAll"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13-8z"/></svg>Run all</button>
  </header>

  <div class="view on" id="vCanvas">
    <aside class="lib" aria-label="Node library">
      <h3 style="margin-top:2px">Template</h3>
      <select class="flowsel" id="flowSel" aria-label="Choose a flow"></select>
      <div id="libList"></div>
    </aside>
    <section class="canvas" id="canvas" aria-label="Node canvas">
      <div class="banner" id="banner"></div>
      <div class="world" id="world"><svg class="wires" id="wires" width="1" height="1"></svg></div>
      <div class="zoom"><button id="zOut" aria-label="Zoom out">−</button><button id="zFit" aria-label="Fit to screen">⤢</button><button id="zIn" aria-label="Zoom in">+</button></div>
    </section>
    <aside class="side" aria-label="Assistant">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="main" aria-selected="true" id="mainTab">AI builder</button>
        <button role="tab" data-tab="rules" aria-selected="false">Do's &amp; don'ts</button>
      </div>
      <div class="chatwrap on" id="chatwrap">
        <div class="thread" id="thread" aria-live="polite"></div>
        <form class="composer" id="composer"><label class="sr" for="ask">Ask the builder agent</label>
          <input id="ask" placeholder="Ask anything… e.g. fix all, dark theme, add agent" autocomplete="off">
          <button aria-label="Send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form>
      </div>
      <div class="pane" id="userPane"></div>
      <div class="pane" id="rulesPane"></div>
    </aside>
  </div>

  <div class="view" id="vFiles"><div class="fwrap" id="filesPage"></div></div>
  <div class="view" id="vNew"><div class="fwrap" id="newPage"></div></div>
  <div class="view" id="vLib">
    <aside class="lnav" id="lnav" aria-label="Design system sections"></aside>
    <main class="ldoc" id="ldoc"></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" id="modal"></div></div>

<script>
/* =================== Tokens (Factory Floor DS v1.4.0) =================== */
const COLORS={
 'interactive-default':{hex:'#3B82F6',role:'interactive',prim:'blue-500'},

 'bg-header':{hex:'#0F172A',role:'surface',prim:'slate-900'}};
const LABELS={'white':{hex:'#FFFFFF',name:'White #FFFFFF'},'text-primary':{hex:'#0F172A',name:'text-primary #0F172A'}};
const TYPES={'heading-lg':{fam:'Outfit',size:18,w:700,desc:'Outfit 18px / Bold',s:'Factory Overviews'},'heading-md':{fam:'Outfit',size:14,w:700,desc:'Outfit 14px / Bold',s:'Device Diagnostics'},'body-md':{fam:'Geist',size:13,w:400,desc:'Geist 13px / Regular',s:'Operational status remains stable.'},'body-sm':{fam:'Geist',size:11,w:400,desc:'Geist 11px / Regular',s:'Last updated 5 mins ago'},'label':{fam:'Geist',size:10,w:600,desc:'Geist 10px / Semibold',s:'SYS ACTIVE'},'mono':{fam:'Geist Mono',size:11,w:500,desc:'Geist Mono 11px / Medium',s:'CONVEYOR-04'}};
const ST={normal:{c:'#10B981',tint:'#CCFBF1',t:'Running',n:'Normal'},warning:{c:'#F59E0B',tint:'#FEF3C7',t:'Warning',n:'Warning'},fault:{c:'#EF4444',tint:'#FEE2E2',t:'Fault',n:'Fault'},idle:{c:'#64748B',tint:'#E2E8F0',t:'Idle',n:'Idle'}};
const PALETTE=[
 ['Status',[['status-normal','#10B981','2.54:1 on white · FAIL text'],['status-warning','#F59E0B','2.15:1 · FAIL text'],['status-error','#EF4444','3.76:1 · AA large only'],['status-idle','#64748B','4.76:1 · AA text'],['status-active','#0D9488','3.74:1 · AA large only']]],
 ['Surface & background',[['bg-app','#F1F5F9','text-primary 16.30:1'],['bg-panel','#FFFFFF','text-primary 17.85:1'],['bg-sidebar','#1E293B','white 14.63:1'],['bg-header','#0F172A','white 17.85:1'],['bg-error-tint','#FEE2E2','text-primary 14.61:1'],['bg-warning-tint','#FEF3C7','text-primary 16.03:1'],['bg-normal-tint','#CCFBF1','text-primary 15.84:1']]],
 ['Text',[['text-primary','#0F172A','17.85:1 · AA text'],['text-secondary','#475569','7.58:1 · AA text'],['text-muted','#94A3B8','2.56:1 · FAIL text'],['text-on-dark','#F8FAFC','17.06:1 on header'],['text-error','#DC2626','4.83:1 · AA text']]],
 ['Interactive & brand',[['brand-primary','#0D9488','3.74:1 · AA large only'],['interactive-default','#3B82F6','3.68:1 · AA large only'],['interactive-hover','#2563EB','5.17:1 · AA text'],['border-default','#E2E8F0','1.23:1 · FAIL UI'],['border-active','#0D9488','3.74:1 · UI AA']]],
 ['Data viz (series identity, not status)',[['viz-series-1','#6366F1','solid line'],['viz-series-2','#60A5FA','dashed line'],['viz-series-3','#34D399','dotted line'],['viz-series-4','#F59E0B','dash-dot line'],['viz-grid','#E2E8F0',''],['viz-axis','#64748B','']]]];
const ICONS={none:'',play:'<path d="M7 4v16l13-8z"/>',refresh:'<path d="M20 11A8 8 0 0 0 5.3 7M4 4v4h4M4 13a8 8 0 0 0 14.7 4M20 20v-4h-4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',download:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',check:'<path d="M5 12l5 5L20 7"/>',alert:'<path d="M12 3L2 20h20z"/><path d="M12 10v4M12 17h.01"/>',home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',map:'<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',bell:'<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/>',cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',chat:'<path d="M4 5h16v11H8l-4 4z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',wrench:'<path d="M14 6a4 4 0 0 0 5 5l-9 9a2 2 0 0 1-3-3l9-9a4 4 0 0 0-2-2z"/>',plug:'<path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0zM12 17v5"/>',gauge:'<path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 14l4-4"/>',wifi:'<path d="M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0M12 20h.01"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',sparkle:'<path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z"/>',filter:'<path d="M4 5h16l-6 8v6l-4-2v-4z"/>'};
const svgI=(k,s=18,c='currentColor')=>k&&ICONS[k]?`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`:'';
const STI={pass:'<path d="M5 12l5 5L20 7"/>',warn:'<path d="M12 3L2 20h20z"/><path d="M12 10v4M12 17h.01"/>',fail:'<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',na:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>'};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lum(h){const n=h.replace('#','');const c=[0,2,4].map(i=>parseInt(n.substr(i,2),16)/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function ratio(a,b){const A=lum(a),B=lum(b);return (Math.max(A,B)+.05)/(Math.min(A,B)+.05);}
const R=(a,b)=>ratio(a,b).toFixed(2)+':1';
const ck=(cat,w,s,t,d,fix)=>({cat,w,s,t,d,fix});

/* =================== Component library =================== */
const statusSel={normal:'Normal',warning:'Warning',fault:'Fault',idle:'Idle'};
const COMP={
 statusDot:{name:'Status dot',group:'Status',desc:'10px, non-interactive. Shows device state next to an ID. Always paired with a state label.',spec:['10px diameter','radius-full','gap 8px','non-interactive'],
  schema:[['state','select',statusSel],['label','select',{on:'Show state label',off:'Color only'}]],def:{state:'warning',label:'on'},

  checks:(p,fx)=>[ck('status',30,p.label==='on'?'pass':'fail','Color never stands alone',p.label==='on'?'Dot is paired with a readable state label.':'A colored dot alone fails in grayscale.',p.label==='on'?null:{label:'Show state label',apply:()=>fx({label:'on'})}),ck('touch',10,'na','Touch target','Non-interactive, no target needed.')],
  dd:['Pair each status color with a readable state label so meaning survives grayscale.','Show only colored dots when users must tell normal, warning and fault apart.']},
 statusBadge:{name:'Status badge',group:'Status',desc:'Inline state tag for rows and cards. Tint background with text-primary label and a 6px dot.',spec:['radius-sm 4px','label token','tint bg','text-primary'],
  schema:[['state','select',statusSel],['text','select',{dark:'text-primary on tint',status:'Status color text'}]],def:{state:'normal',text:'dark'},

  render:p=>{const s=ST[p.state];return `<span class="k-badge" style="background:${s.tint};color:${p.text==='dark'?'#0F172A':s.c}"><span class="k-dot" style="background:${s.c}"></span>${s.t.toUpperCase()}</span>`;},
  checks:(p,fx)=>{const s=ST[p.state];const r=ratio(p.text==='dark'?'#0F172A':s.c,s.tint);return [ck('contrast',40,r>=4.5?'pass':'fail',`Text contrast ${r.toFixed(2)}:1`,`Badge label is 10px, so it needs 4.5:1.`,r>=4.5?null:{label:'Use text-primary on the tint',apply:()=>fx({text:'dark'})}),ck('status',20,'pass','Label + color','State word is always shown.')];},
  dd:['Use tint backgrounds with text-primary so the badge reads at 10px.','Write status colors as text on white. Amber is 2.15:1 and green 2.54:1.']},
 toolbarBtn:{name:'Toolbar button',group:'Actions',desc:'Icon-only action in panel headers and top action bars. 44×44 touch target with an 18px icon.',spec:['44×44 target','18×18 icon','radius-md 8px','transition-default'],
  schema:[['icon','select',ICONS],['state','select',{default:'Default',hover:'Hover',active:'Active'}],['size','select',{44:'44px',32:'32px'}],['label','text']],def:{icon:'settings',state:'default',size:'44',label:'Settings'},
  variants:[{state:'default'},{state:'hover'},{state:'active'},{state:'default',size:'32'}],
  render:p=>`<button class="k-tool ${p.state} ${p.size==='32'?'small':''}" aria-label="${esc(p.label)}" title="${esc(p.label)}" tabindex="-1">${svgI(p.icon,18)}</button>`,
  checks:(p,fx)=>{const bg=p.state==='active'?'#0D9488':p.state==='hover'?'#F1F5F9':'#FFFFFF',fg=p.state==='active'?'#FFFFFF':'#475569';const r=ratio(fg,bg);return [
   ck('touch',25,p.size==='44'?'pass':'fail','Touch target',p.size==='44'?'44×44 meets the minimum.':'32px is below the 44px minimum.',p.size==='44'?null:{label:'Make it 44×44',apply:()=>fx({size:'44'})}),
   ck('contrast',30,r>=3?'pass':'fail',`Icon contrast ${r.toFixed(2)}:1`,'UI icons need 3:1.'),
   ck('meaning',25,p.label?'pass':'fail','Accessible name',p.label?`Exposed as aria-label “${esc(p.label)}” with a tooltip.`:'Icon-only with no name for assistive tech.',p.label?null:{label:'Add an aria-label',apply:()=>fx({label:'Settings'})}),
   ck('focus',10,'pass','Focus ring','2px interactive-focus ring.')];},
  dd:['Keep 44×44 targets and give every icon-only button an aria-label and tooltip.','Shrink to 32px to fit more icons in a bar.']},
 primaryBtn:{name:'Primary button',group:'Actions',desc:'The one main action in a panel. Built in the “Primary button” flow from color, type and label tokens.',spec:['min-height 44px','radius-md 8px','elevation-sm','heading-md label (suggested)'],
  schema:[['fill','select',COLORS],['text','text'],['icon','select',ICONS]],def:{fill:'interactive-hover',text:'Run diagnostics',icon:'play'},
  variants:[{fill:'interactive-hover'},{fill:'interactive-default'},{fill:'brand-primary'},{fill:'interactive-hover',icon:'none',text:'Schedule maintenance'}],

   <div style="flex:1;display:grid;grid-template-columns:1fr 290px;gap:16px;padding:16px;min-height:0">
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0"><div style="display:flex;gap:10px">${[['Floor health','94%','1 degradation predicted'],['Running','82','tools online'],['Warning','3','need a look'],['Down','1','in maintenance']].map(k=>`<div class="k-kpi" style="flex:1;min-width:0"><span class="lbl" style="color:var(--tx2)">${k[0]}</span><span class="h-lg">${k[1]}</span><span class="b-sm" style="color:var(--meta)">${k[2]}</span></div>`).join('')}</div>
     <div style="background:var(--panel);border:1px solid var(--bd);border-radius:12px;overflow:hidden"><div style="padding:12px 12px 8px;display:flex;justify-content:space-between"><span class="h-md">Live tool clusters</span><span class="meta">Updated 5 mins ago</span></div>${rowsFor([['CNC-01','normal',82,'Machining'],['CNC-02','normal',76,'Machining'],['PRESS-01','warning',64,'Press line'],['PRESS-02','normal',71,'Press line'],['PRESS-03','fault',12,'Press line'],['PACK-01','idle',0,'Packaging']],p)}</div></div>
    <div style="display:flex;flex-direction:column;gap:12px">${COMP.predictionCard.render({tool:'PRESS-01',issue:'Line pressure trending high',conf:'80',confirm:'yes'}).replace('width:280px','width:100%')}
     <span class="h-md">Smart alarm queue</span>${banner(p,'TEMP-02 at 84°C. Operation continues; monitor temperature.')}<div class="k-alert" style="background:#FEE2E2;border-color:#EF4444">${svgI('alert',18,'#0F172A')}<span><b>CRITICAL:</b> PRESS-03 hydraulic leak. Line stopped; route work to the standby line.</span></div></div></div></div></div>`,
  },
 diagnostics:{name:'Floor map + device diagnostics',desc:'Split view: spatial zone map on the left, the Device Diagnostics panel with device rows, ports and an alert on the right.',
  render:p=>`<div style="display:grid;grid-template-columns:200px 1fr 360px;height:600px">${navCol(p,'Floor map')}<div style="padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0"><div style="display:flex;justify-content:space-between;align-items:center"><span class="h-lg">Zone 3 — Press line</span><span class="meta">11 devices active</span></div>
   <div style="flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px">${[['A-1','normal'],['A-2','normal'],['A-3','warning'],['B-1','normal'],['B-2','fault'],['B-3','normal']].map(b=>`<div style="background:var(--panel);border:1px solid ${b[1]==='warning'?'#F59E0B':b[1]==='fault'?'#EF4444':'var(--bd)'};border-width:${b[1]==='normal'?1:2}px;border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:space-between"><span class="mono">${b[0]}</span><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${Array.from({length:8},(_,i)=>`<span style="height:18px;border-radius:4px;background:var(--app);border:1px solid var(--bd)"></span>`).join('')}</div><span class="k-dotwrap" style="font-size:11px"><span class="k-dot" style="background:${ST[b[1]].c}"></span>${p.labels==='on'?ST[b[1]].n:''}</span></div>`).join('')}</div></div>
   <div style="background:var(--panel);border-left:1px solid var(--bd);display:flex;flex-direction:column">${COMP.panelHeader.render({title:'Device Diagnostics',btn:'44'})}<div style="padding:12px">${banner(p,'TEMP-02 at 84°C. Operation continues; monitor temperature.')}</div>${rowsFor([['CONVEYOR-04','normal',82],['ROBOT-07','warning',64],['SENSOR-12','fault',12]],p)}<div style="padding:12px 16px 4px" class="lbl">Ports</div>${COMP.portRow.render(COMP.portRow.def)}${COMP.portRow.render({name:'Port 02B — Ethernet',dir:'OUTPUT',rate:'640 MB/s',pct:'31'})}<div style="padding:12px 16px" class="meta">Last updated 5 mins ago</div></div></div>`},
 predictive:{name:'Predictive health panel',desc:'AI health monitoring: device list with health %, the predicted issue with confidence, telemetry sensors and port allocation.',
  render:p=>`<div style="display:grid;grid-template-columns:240px 1fr 260px;height:600px;gap:0">
   <div style="background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column"><div style="padding:16px 12px 8px"><span class="h-md">Zone 3 — Press line</span><div class="meta">6 devices</div></div>${[['Press-01','warning','87'],['Press-02','normal','98'],['Press-03','normal','95'],['Press-04','normal','99'],['Press-05','normal','94'],['Press-06','idle','—']].map(d=>`<div class="k-row" style="${d[0]==='Press-01'?'box-shadow:inset 3px 0 0 #2563EB':''}"><div class="l"><span class="k-dot" style="background:${ST[d[1]].c}"></span><span class="mono">${d[0]}</span></div><div class="r">${p.labels==='on'?`<span class="b-sm">${d[1]==='idle'?'Maintenance':'Health '+d[2]+'%'}</span>`:''}</div></div>`).join('')}</div>
   <div style="padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--app)">${banner(p,'Press-01 line pressure above baseline. Operation continues.')}${COMP.predictionCard.render({tool:'Press-01',issue:'Line pressure deviation',conf:'80',confirm:'yes'}).replace('width:280px','width:100%')}
    <div style="background:var(--panel);border:1px solid var(--bd);border-radius:12px;overflow:hidden"><div style="padding:12px" class="h-md">Telemetry sensors</div>${[['Line pressure','6.1 bar','fault',92],['Flow rate','40 L/min','normal',58],['Temperature','68 °C','normal',61],['Power draw','12 kW','warning',74]].map(s=>`<div class="k-row"><div class="l"><span>${s[0]}</span></div><div class="r"><span class="mono">${s[1]}</span>${p.labels==='on'?COMP.statusBadge.render({state:s[2],text:'dark'}):`<span class="k-dot" style="background:${ST[s[2]].c}"></span>`}</div></div>`).join('')}</div></div>
   <div style="background:var(--panel);border-left:1px solid var(--bd);padding:16px;display:flex;flex-direction:column;gap:10px"><span class="h-md">Port allocation</span>${[['Port 1','Job 221'],['Port 2','Empty'],['Port 3','Next: Job 902']].map(x=>`<div style="border:1px solid var(--bd);border-radius:8px;padding:10px"><div class="lbl" style="color:var(--tx2)">${x[0]}</div><div>${x[1]}</div></div>`).join('')}<span class="meta">Last updated 5 mins ago</span></div></div>`},
 copilot:{name:'Maintenance copilot',desc:'Conversational troubleshooting next to spatial context: chat, quick actions, similar past incidents and the related station card.',
  render:p=>`<div style="display:grid;grid-template-columns:200px 1fr 300px;height:600px">${navCol(p,'Copilot')}<div style="display:flex;flex-direction:column;background:var(--panel);min-width:0"><div style="height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--bd)"><span class="k-ai">${svgI('sparkle',12)}AI</span><span class="h-lg">Maintenance copilot</span><span class="meta" style="margin-left:auto">Press-01 · Zone 3</span></div>
   <div style="flex:1;padding:16px;display:flex;flex-direction:column;gap:10px">${banner(p,'Press-01 pressure trending high. Operation continues; monitor.')}<div class="k-bubble u">Diagnose Press-01</div><div class="k-bubble a">Pressure variance rose over the last few hours. The pattern matches a past valve failure. Most likely cause: an upstream blockage, not sensor drift.</div><div class="k-bubble a">I can prepare a maintenance check for you to review, or show similar cases.</div><div style="display:flex;gap:8px;flex-wrap:wrap">${['Review maintenance','Run diagnostics','Show similar cases','Schedule maintenance'].map(c=>`<span class="k-chip">${c}</span>`).join('')}</div><span class="meta">AI suggestions need a person to confirm before any tool action.</span></div>
   <div style="padding:12px;border-top:1px solid var(--bd)"><div style="height:40px;border:1px solid var(--bd);border-radius:8px;display:flex;align-items:center;padding:0 12px;color:var(--meta)" class="b-sm">Ask the copilot…</div></div></div>
   <div style="background:var(--app);border-left:1px solid var(--bd);padding:16px;display:flex;flex-direction:column;gap:12px">${COMP.stationCard.render({name:'Press-01',cap:'90',use:'44',icons:p.labels==='on'?'labels':'bare'}).replace('width:250px','width:100%')}<div class="k-card"><span class="h-md">Similar incidents</span><span class="b-sm">Valve failure, Line 2 · 90% match</span><span class="b-sm">Inlet blockage, Zone 3 · 80% match</span></div></div></div>`}
};
const SCREEN_SCHEMA=[['tpl','select',Object.fromEntries(Object.entries(SCREENS).map(([k,v])=>[k,v.name]))],['device','select',{desktop:'Desktop · LG',tablet:'Tablet portrait · SM 834',mobile:'Mobile · XS 390',voice:'Voice / HUD'}],['meta','select',{secondary:'Meta text: text-secondary',muted:'Meta text: text-muted'}],['sev','select',{critical:'Banner: critical',warning:'Banner: warning'}],['labels','select',{on:'Status labels on',off:'Status color only'}],['nav','select',{fill:'Nav selected: teal fill',ind:'Nav selected: indicator'}]];
/* =================== Device versions: tablet (SM), mobile (XS), voice/HUD =================== */
const DEVICES={desktop:{w:960,h:600,label:'Desktop',bp:'LG · 1240–1439px',rule:'Three columns, navigation drawer, 24px spacing'},
 tablet:{w:834,h:1112,label:'Tablet portrait',bp:'SM · 600–904px',rule:'Single column, custom tab bar, 16px spacing'},
 mobile:{w:390,h:844,label:'Mobile',bp:'XS · 0–599px',rule:'Single column, bottom nav, 12px spacing'},
 voice:{w:960,h:540,label:'Voice / HUD',bp:'Not in the breakpoint matrix',rule:'Separate AR adaptation: hands-free, spoken + visual'}};
const NAV5=[['home','Overview'],['map','Floor map'],['bell','Alerts'],['cpu','Devices'],['chat','Copilot']];
const ACTIVE={dashboard:'Overview',diagnostics:'Floor map',predictive:'Devices',copilot:'Copilot'};
function bottomNav(p){const act=ACTIVE[p.tpl];return `<div style="height:68px;background:var(--panel);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 6px 8px">${NAV5.map(n=>{const on=n[1]===act;const fill=on&&p.nav==='fill';
 return `<div style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;margin:0 2px;border-radius:8px;font-size:10px;font-weight:${on?600:400};${fill?'background:#0D9488;color:#fff':on?'color:var(--tx)':'color:var(--tx2)'}">${on&&!fill?'<span style="position:absolute;top:0;left:30%;right:30%;height:3px;background:#0D9488"></span>':''}${svgI(n[0],22)}<span>${n[1]}</span></div>`;}).join('')}</div>`;}
function tabBar(p){const act=ACTIVE[p.tpl];return `<div style="display:flex;gap:4px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--bd)">${NAV5.map(n=>{const on=n[1]===act,fill=on&&p.nav==='fill';
 return `<div style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;font-size:13px;${fill?'background:#0D9488;color:#fff;border-radius:8px;margin:6px 0;min-height:36px':on?'color:var(--tx);box-shadow:inset 0 -3px 0 #0D9488;font-weight:600':'color:var(--tx2)'}">${svgI(n[0],18)}${n[1]}</div>`;}).join('')}</div>`;}
function appBar(title,sub,h){return `<div style="height:${h||56}px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 12px 0 16px"><div style="flex:1;min-width:0"><div class="h-lg" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div>${sub?`<div class="meta">${sub}</div>`:''}</div><button class="k-tool" aria-label="Search" tabindex="-1">${svgI('search',18)}</button><button class="k-tool" aria-label="Alerts" tabindex="-1">${svgI('bell',18)}</button></div>`;}
const kpi=(l,v,n)=>`<div class="k-kpi" style="min-width:0"><span class="lbl" style="color:var(--tx2)">${l}</span><span class="h-lg">${v}</span><span class="b-sm" style="color:var(--meta)">${n}</span></div>`;
const panel=(title,inner,right)=>`<div style="background:var(--panel);border:1px solid var(--bd);border-radius:12px;overflow:hidden"><div style="padding:12px;display:flex;justify-content:space-between;align-items:center"><span class="h-md">${title}</span>${right?`<span class="meta">${right}</span>`:''}</div>${inner}</div>`;
const pred=(tool,issue)=>COMP.predictionCard.render({tool,issue,conf:'80',confirm:'yes'}).replace('width:280px','width:100%');
const TOOLS=[['CNC-01','normal',82,'Machining'],['PRESS-01','warning',64,'Press line'],['PRESS-02','normal',71,'Press line'],['PRESS-03','fault',12,'Press line'],['PACK-01','idle',0,'Packaging']];
const SENS=[['Line pressure','6.1 bar','fault'],['Flow rate','40 L/min','normal'],['Temperature','68 °C','normal'],['Power draw','12 kW','warning']];
const sensRows=p=>SENS.map(s=>`<div class="k-row"><div class="l"><span>${s[0]}</span></div><div class="r"><span class="mono">${s[1]}</span>${p.labels==='on'?COMP.statusBadge.render({state:s[2],text:'dark'}):`<span class="k-dot" style="background:${ST[s[2]].c}"></span>`}</div></div>`).join('');
const zoneTiles=(p,cols)=>`<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:8px">${[['A-1','normal'],['A-2','normal'],['A-3','warning'],['B-1','normal'],['B-2','fault'],['B-3','normal']].map(b=>`<div style="background:var(--panel);border:${b[1]==='normal'?1:2}px solid ${b[1]==='warning'?'#F59E0B':b[1]==='fault'?'#EF4444':'var(--bd)'};border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px"><span class="mono">${b[0]}</span><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px">${Array.from({length:4},()=>`<span style="height:14px;border-radius:4px;background:var(--app);border:1px solid var(--bd)"></span>`).join('')}</div><span class="k-dotwrap" style="font-size:11px"><span class="k-dot" style="background:${ST[b[1]].c}"></span>${p.labels==='on'?ST[b[1]].n:''}</span></div>`).join('')}</div>`;
const chat=(p)=>`<div class="k-bubble u">Diagnose Press-01</div><div class="k-bubble a">Pressure variance rose over the last few hours. The pattern matches a past valve failure. Most likely cause: an upstream blockage, not sensor drift.</div><div class="k-bubble a">I can prepare a maintenance check for you to review, or show similar cases.</div><div style="display:flex;gap:8px;flex-wrap:wrap">${['Review maintenance','Run diagnostics','Similar cases'].map(c=>`<span class="k-chip">${c}</span>`).join('')}</div>`;
const askBar=`<div style="height:44px;border:1px solid var(--bd);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--meta);background:var(--panel)" class="b-sm">${svgI('chat',16)}Ask the copilot…</div>`;
const BAN_MSG={dashboard:'TEMP-02 at 84°C. Operation continues; monitor temperature.',diagnostics:'TEMP-02 at 84°C. Operation continues; monitor temperature.',predictive:'Press-01 line pressure above baseline. Operation continues.',copilot:'Press-01 pressure trending high. Operation continues; monitor.'};
const MOBILE={
 dashboard:p=>[appBar('Factory overview','Updated 5 mins ago'),`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${kpi('Floor health','94%','1 degradation')}${kpi('Running','82','tools online')}${kpi('Warning','3','need a look')}${kpi('Down','1','in maintenance')}</div>${banner(p,BAN_MSG.dashboard)}${pred('PRESS-01','Line pressure trending high')}${panel('Live tools',rowsFor(TOOLS.slice(0,4),p))}`],
 diagnostics:p=>[appBar('Zone 3 — Press line','11 devices active'),`${zoneTiles(p,3)}${banner(p,BAN_MSG.diagnostics)}<div style="background:var(--panel);border:1px solid var(--bd);border-radius:12px;overflow:hidden">${COMP.panelHeader.render({title:'Device Diagnostics',btn:'44'})}${rowsFor([['CONVEYOR-04','normal',82],['ROBOT-07','warning',64],['SENSOR-12','fault',12]],p)}</div>`],
 predictive:p=>[appBar('Press-01','Zone 3 · Press line'),`${banner(p,BAN_MSG.predictive)}${pred('Press-01','Line pressure deviation')}${panel('Sensors',sensRows(p),'Live')}<span class="meta">Last updated 5 mins ago</span>`],
 copilot:p=>[appBar('<span class="k-ai" style="vertical-align:middle">'+svgI('sparkle',12)+'AI</span> Copilot','Press-01 · Zone 3'),`${banner(p,BAN_MSG.copilot)}<div style="display:flex;flex-direction:column;gap:10px">${chat(p)}</div><span class="meta">A person confirms before any tool action.</span><div style="margin-top:auto">${askBar}</div>`]};
const TABLET={
 dashboard:p=>`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">${kpi('Floor health','94%','1 degradation predicted')}${kpi('Running','82','tools online')}${kpi('Warning','3','need a look')}${kpi('Down','1','in maintenance')}</div>${banner(p,BAN_MSG.dashboard)}${pred('PRESS-01','Line pressure trending high')}${panel('Live tool clusters',rowsFor(TOOLS,p),'Updated 5 mins ago')}`,
 diagnostics:p=>`<div style="display:flex;justify-content:space-between"><span class="h-lg">Zone 3 — Press line</span><span class="meta">11 devices active</span></div>${zoneTiles(p,3)}<div style="background:var(--panel);border:1px solid var(--bd);border-radius:12px;overflow:hidden">${COMP.panelHeader.render({title:'Device Diagnostics',btn:'44'})}<div style="padding:12px 16px">${banner(p,BAN_MSG.diagnostics)}</div>${rowsFor([['CONVEYOR-04','normal',82],['ROBOT-07','warning',64],['SENSOR-12','fault',12]],p)}<div style="padding:12px 16px 4px" class="lbl">Ports</div>${COMP.portRow.render(COMP.portRow.def)}${COMP.portRow.render({name:'Port 02B — Ethernet',dir:'OUTPUT',rate:'640 MB/s',pct:'31'})}</div>`,
 predictive:p=>`${banner(p,BAN_MSG.predictive)}${pred('Press-01','Line pressure deviation')}${panel('Telemetry sensors',sensRows(p),'Last updated 5 mins ago')}${panel('Devices in Zone 3',[['Press-01','warning','80'],['Press-02','normal','98'],['Press-03','normal','95'],['Press-04','idle','—']].map(d=>`<div class="k-row"><div class="l"><span class="k-dot" style="background:${ST[d[1]].c}"></span><span class="mono">${d[0]}</span></div><div class="r">${p.labels==='on'?`<span class="b-sm">${d[1]==='idle'?'Maintenance':'Health '+d[2]+'%'}</span>`:''}</div></div>`).join(''))}`,
 copilot:p=>`${banner(p,BAN_MSG.copilot)}<div style="background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px">${chat(p)}<span class="meta">A person confirms before any tool action.</span>${askBar}</div>${COMP.stationCard.render({name:'Press-01',cap:'90',use:'44',icons:p.labels==='on'?'labels':'bare'}).replace('width:250px','width:100%')}`};
const VOICE={
 dashboard:{ctx:'Floor overview',heard:'Give me the floor summary.',answer:'Floor health is 94%. 82 tools are running, 3 need a look and 1 is down.',rows:[['PRESS-01','warning','Pressure trending high'],['PRESS-03','fault','Hydraulic leak, line stopped']],say:['“Read the alerts”','“Open Press-01”','“Show Zone 3”','“Stop”']},
 diagnostics:{ctx:'Zone 3 — Press line',heard:'What’s wrong in Zone 3?',answer:'Two devices need attention. ROBOT-07 is in warning and SENSOR-12 has a fault.',rows:[['ROBOT-07','warning','Temperature over threshold'],['SENSOR-12','fault','No signal for 4 minutes']],say:['“Details on SENSOR-12”','“Show ports”','“Call the lead”','“Stop”']},
 predictive:{ctx:'Press-01 · Zone 3',heard:'How is Press-01 doing?',answer:'Press-01 is running. Line pressure is trending high, with a possible failure in about 30 minutes.',rows:[['Line pressure','fault','6.1 bar'],['Power draw','warning','12 kW']],say:['“Review maintenance”','“Schedule it”','“Read sensors”','“Stop”']},
 copilot:{ctx:'Press-01 · Guided fix',heard:'Walk me through the fix.',answer:'Step 1 of 4: isolate power to Press-01, then check the inlet valve. Say “confirm” when power is isolated.',rows:[['Step 1','warning','Isolate power · waiting'],['Step 2','idle','Check inlet valve']],say:['“Confirm”','“Repeat step”','“Next step”','“Stop”']}};
function voiceHUD(p){const v=VOICE[p.tpl];const S=p.sev==='critical'?ST.fault:ST.warning;
 return `<div style="position:relative;width:960px;height:540px;background:#020617;background-image:radial-gradient(#1E293B 1px,transparent 1px);background-size:24px 24px;color:#F8FAFC;font-family:Geist;padding:20px 24px;display:grid;grid-template-columns:1fr 260px;grid-template-rows:auto 1fr auto;gap:16px">
 <div style="grid-column:1/3;display:flex;align-items:center;gap:12px"><span class="mono" style="color:#94A3B8">HUD · ${v.ctx}</span><span style="flex:1"></span><span style="display:inline-flex;align-items:center;gap:8px;background:rgba(15,23,42,.9);border:1px solid #334155;border-radius:999px;padding:4px 12px;font-size:12px"><span style="width:8px;height:8px;border-radius:50%;background:#10B981"></span>Listening</span></div>
 <div style="display:flex;flex-direction:column;gap:12px;min-width:0"><div class="k-alert" style="background:${S.tint};border-color:${S.c}">${svgI('alert',18,'#0F172A')}<span><b>${p.sev.toUpperCase()}:</b> ${BAN_MSG[p.tpl]} <span style="opacity:.8">(spoken + shown)</span></span></div>
  <div style="background:rgba(15,23,42,.9);border:1px solid #334155;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px"><span class="lbl" style="color:#94A3B8">You said</span><span style="font-size:13px;color:#CBD5E1">“${v.heard}”</span><span class="lbl" style="color:#A5B4FC;display:flex;align-items:center;gap:4px">${svgI('sparkle',12,'#A5B4FC')}Response · spoken aloud</span><span class="h-lg" style="line-height:1.35">${v.answer}</span></div>
  <div style="background:rgba(15,23,42,.9);border:1px solid #334155;border-radius:12px;overflow:hidden">${v.rows.map(r=>`<div style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-bottom:1px solid #1E293B"><span class="k-dot" style="background:${ST[r[1]].c}"></span><span class="mono" style="font-size:12px">${r[0]}</span>${p.labels==='on'?COMP.statusBadge.render({state:r[1],text:'dark'}):''}<span style="margin-left:auto;font-size:12px;color:var(--meta)">${r[2]}</span></div>`).join('')}</div></div>

  <div class="fld" id="nName"><label for="nNameI">Name</label><input type="text" id="nNameI" maxlength="60" placeholder="e.g. Device panel review"><span class="err">${sIcon('fail')}Give the graph a name.</span></div>
  <div class="fld"><label for="nDesc">Description <span class="small">(optional)</span></label><textarea id="nDesc" placeholder="What is this graph for?"></textarea></div>
  <fieldset class="fld"><legend>Start from</legend><div class="tgrid">${Object.entries(TPL_INFO).map(([k,v])=>`<label class="topt"><input type="radio" name="tpl" value="${k}" ${k===t0?'checked':''}><span class="tc"><span class="tt">${svgI(k==='blank'?'layers':k==='screen'?'map':k==='button'?'play':k==='alert'?'alert':'list',16)}${v[0]}</span><span class="td">${v[1]}</span>${v[2].length?`<span class="chain">${v[2].map(c=>`<span>${c}</span>`).join('')}</span>`:''}</span></label>`).join('')}</div></fieldset>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="fld" id="nThemeF"><label for="nTheme">Theme mode</label><select id="nTheme"><option value="light">Cleanroom / Light</option><option value="dark">Dark</option></select><span class="hint">Used by templates with a Theme node.</span></div>
  <div class="fld"><label for="nMode">Open in view</label><select id="nMode"><option value="both">Both</option><option value="builder">Builder · AI as builder</option><option value="user">User 1 · AI as a node</option></select></div></div>
  <div style="display:flex;gap:8px"><button type="submit" class="tbtn primary">Create graph</button><button type="button" class="tbtn" id="nCancel">Cancel</button></div></div>
  <aside class="sumcard" id="nSum"></aside></form>`;
 const sum=()=>{const k=pg.querySelector('input[name=tpl]:checked').value,v=TPL_INFO[k];const nm=document.getElementById('nNameI').value.trim();
  document.getElementById('nThemeF').style.opacity=k==='screen'?1:.5;document.getElementById('nTheme').disabled=k!=='screen';
  document.getElementById('nSum').innerHTML=`<h3>${esc(nm||'Untitled graph')}</h3><dl class="kv"><dt>Template</dt><dd>${v[0]}</dd><dt>Nodes</dt><dd>${v[2].length?v[2].join(' → '):'None yet'}</dd><dt>Theme</dt><dd>${k==='screen'?document.getElementById('nTheme').selectedOptions[0].text:'—'}</dd><dt>View</dt><dd>${document.getElementById('nMode').selectedOptions[0].text}</dd></dl><p class="small" style="margin:0">Saves automatically as you work. Export JSON any time from the File menu.</p>`;};
 pg.querySelectorAll('input,select,textarea').forEach(i=>i.addEventListener('input',sum));pg.querySelectorAll('input[name=tpl]').forEach(i=>i.addEventListener('change',()=>{const nm=document.getElementById('nNameI');if(!nm.value.trim()||Object.values(TPL_INFO).some(v=>v[0]===nm.value.trim()))nm.value=TPL_INFO[i.value][0]==='Blank canvas'?'':TPL_INFO[i.value][0];sum();}));
 document.getElementById('nNameI').value=TPL_INFO[t0][0]==='Blank canvas'?'':TPL_INFO[t0][0];sum();document.getElementById('nNameI').focus();
 document.getElementById('nNameI').addEventListener('input',()=>document.getElementById('nName').classList.remove('bad'));
 document.getElementById('nCancel').onclick=()=>showView(files.length?'files':'canvas');
 document.getElementById('newForm').addEventListener('submit',e=>{e.preventDefault();const nm=document.getElementById('nNameI').value.trim();if(!nm){document.getElementById('nName').classList.add('bad');document.getElementById('nNameI').focus();return;}
  const k=pg.querySelector('input[name=tpl]:checked').value,th=document.getElementById('nTheme').value,md=document.getElementById('nMode').value;
  flushSave();createFileEntry(uniqueName(nm),document.getElementById('nDesc').value.trim(),k);setMode(md,true);showView('canvas');flowSel.value=k;
  loadFlow(k,false,()=>{const t=Object.values(nodes).find(n=>n.kind==='theme');if(t&&th==='dark'){t.data.mode='dark';renderNode(t.id);lastSig='';refresh(false);}saveNow();toast('Created “'+curFile().name+'”');});});}

/* =================== Start =================== */
mode='both';document.getElementById('banner').innerHTML=BAN.both;
startFiles();
requestAnimationFrame(()=>requestAnimationFrame(()=>setMode('both')));
document.fonts&&document.fonts.ready.then(()=>{refresh(false);fitView();});
</script>
</body>
</html>
